<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕骑车 · 傍晚海堤落日</title>
<style>
  html,body{margin:0;height:100%;background:#120f22;overflow:hidden;
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none}
  #stage{position:fixed;inset:0;touch-action:none;cursor:pointer}
  svg{width:100%;height:100%;display:block}
  .hud{position:fixed;left:22px;top:20px;color:#fff3df;z-index:5;
    background:rgba(28,18,46,.42);backdrop-filter:blur(6px);
    border:1px solid rgba(255,220,170,.22);border-radius:14px;padding:14px 16px 12px;
    min-width:196px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .hud .row{display:flex;align-items:baseline;gap:8px;margin:2px 0;line-height:1.5}
  .hud .k{font-size:12px;letter-spacing:.14em;color:#ffd9a3;opacity:.9;width:48px}
  .hud .v{font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;min-width:86px;text-align:right}
  .hud .u{font-size:11px;opacity:.7}
  .bar{margin-top:9px;height:6px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden}
  .bar i{display:block;height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,#ffd166,#ff7a59);transition:width .08s linear}
  .hint{position:fixed;left:0;right:0;bottom:18px;text-align:center;z-index:5;
    color:#ffeccf;font-size:13px;letter-spacing:.04em;opacity:.86;text-shadow:0 2px 10px rgba(0,0,0,.5)}
  .hint b{display:inline-block;padding:1px 7px;margin:0 1px;border-radius:6px;
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.2);font-weight:600}
  .ding{position:fixed;left:50%;top:16%;transform:translate(-50%,6px) scale(.8);z-index:6;
    color:#fff;font-size:30px;font-weight:800;letter-spacing:.1em;opacity:0;pointer-events:none;
    text-shadow:0 3px 14px rgba(255,120,60,.8)}
  .ding.on{animation:pop .62s ease-out}
  @keyframes pop{
    0%{opacity:0;transform:translate(-50%,10px) scale(.7) rotate(-6deg)}
    28%{opacity:1;transform:translate(-50%,-10px) scale(1.14) rotate(3deg)}
    100%{opacity:0;transform:translate(-50%,-44px) scale(1) rotate(0)}}
</style>
</head>
<body>
<div id="stage">
<svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-label="鹈鹕骑自行车">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2550"/>
      <stop offset="0.3" stop-color="#6c3f7b"/>
      <stop offset="0.58" stop-color="#d9564f"/>
      <stop offset="0.8" stop-color="#ff8f4c"/>
      <stop offset="1" stop-color="#ffc877"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#ffb463" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ff8a4c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e98a53"/>
      <stop offset="0.16" stop-color="#9a5c76"/>
      <stop offset="0.52" stop-color="#2f5a85"/>
      <stop offset="1" stop-color="#1d3f63"/>
    </linearGradient>
    <linearGradient id="vigGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1030" stop-opacity="0.42"/>
      <stop offset="0.35" stop-color="#1a1030" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#1a1030" stop-opacity="0"/>
      <stop offset="1" stop-color="#1a1030" stop-opacity="0.38"/>
    </linearGradient>
    <clipPath id="pouchClip">
      <path d="M76,-236 C62,-206 84,-174 118,-174 C152,-174 170,-204 175,-231
               C140,-222 104,-227 76,-236 Z"/>
    </clipPath>
  </defs>

  <!-- 天空 / 落日 -->
  <rect x="0" y="0" width="1600" height="642" fill="url(#skyGrad)"/>
  <g id="sunGroup">
    <circle cx="1185" cy="392" r="300" fill="url(#sunGlow)"/>
    <circle cx="1185" cy="392" r="74" fill="#ffe7a0"/>
    <circle cx="1185" cy="392" r="60" fill="#fff4cf"/>
  </g>
  <g id="cloudLayer"></g>
  <g id="islandLayer"></g>
  <g id="gullLayer"></g>

  <!-- 海面 -->
  <rect x="0" y="470" width="1600" height="172" fill="url(#seaGrad)"/>
  <g id="glitterLayer"></g>
  <g id="waveLayer"></g>

  <!-- 海堤 -->
  <rect x="0" y="636" width="1600" height="40" fill="#f2e0c1"/>
  <rect x="0" y="636" width="1600" height="7" fill="#fff3da"/>
  <rect x="0" y="668" width="1600" height="12" fill="#d3b891"/>
  <rect x="0" y="678" width="1600" height="222" fill="#e6d2ae"/>
  <g id="railLayer"></g>
  <g id="tileLayer"></g>
  <g id="lampLayer"></g>

  <!-- 鹈鹕与自行车 -->
  <g id="rider" transform="translate(600,772) scale(1.22)">
    <ellipse id="shadow" cx="4" cy="6" rx="104" ry="13" fill="#b89c74" opacity="0.5"/>
    <g id="bike">
      <g id="wheelRear" transform="translate(-70,-46)">
        <circle r="46" fill="none" stroke="#23232e" stroke-width="7"/>
        <g id="spokesRear" stroke="#f1e6d2" stroke-width="2" opacity="0.72"></g>
        <circle r="5.5" fill="#f1e6d2"/>
      </g>
      <g id="wheelFront" transform="translate(78,-46)">
        <circle r="46" fill="none" stroke="#23232e" stroke-width="7"/>
        <g id="spokesFront" stroke="#f1e6d2" stroke-width="2" opacity="0.72"></g>
        <circle r="5.5" fill="#f1e6d2"/>
      </g>
      <g stroke="#23232e" stroke-width="7" stroke-linecap="round" fill="none">
        <path d="M-70,-46 L0,-40 M0,-40 L-30,-126 M-30,-126 L-70,-46 M-30,-126 L60,-122 M60,-122 L0,-40 M60,-122 L78,-46"/>
      </g>
      <path d="M-52,-130 Q-30,-140 -12,-128 Q-32,-123 -52,-130 Z" fill="#1b1b26"/>
      <g id="crankA">
        <line x1="0" y1="-40" x2="0" y2="-40" stroke="#39394b" stroke-width="6" stroke-linecap="round" id="crankALine"/>
        <rect id="pedalA" x="-12" y="-3" width="24" height="6" rx="3" fill="#2a2a38"/>
      </g>
      <g id="crankB">
        <line x1="0" y1="-40" x2="0" y2="-40" stroke="#4a4a60" stroke-width="6" stroke-linecap="round" id="crankBLine"/>
        <rect id="pedalB" x="-12" y="-3" width="24" height="6" rx="3" fill="#3a3a4c"/>
      </g>
      <circle cx="0" cy="-40" r="11" fill="none" stroke="#39394b" stroke-width="4"/>
    </g>

    <g id="legFar" stroke-linecap="round" fill="none">
      <path id="legFarThigh" stroke="#d0803a" stroke-width="11" d=""/>
      <path id="legFarShin" stroke="#d0803a" stroke-width="9" d=""/>
      <ellipse id="footFar" rx="12" ry="5" fill="#d0803a"/>
    </g>
    <g id="legNear" stroke-linecap="round" fill="none">
      <path id="legNearThigh" stroke="#f2a24a" stroke-width="12" d=""/>
      <path id="legNearShin" stroke="#f2a24a" stroke-width="10" d=""/>
      <ellipse id="footNear" rx="13" ry="5.5" fill="#f5b263"/>
    </g>

    <g id="pelican">
      <path d="M-56,-190 C-78,-198 -100,-196 -112,-186 C-98,-180 -86,-172 -62,-166 Z" fill="#e8d9c0"/>
      <path d="M-58,-182 C-78,-186 -94,-184 -104,-178" stroke="#d8c5a4" stroke-width="2.5" fill="none"/>
      <ellipse cx="-16" cy="-178" rx="48" ry="37" fill="#fff8ea" transform="rotate(-9,-16,-178)"/>
      <path d="M-44,-152 C-20,-142 14,-146 34,-162 C20,-144 -16,-134 -44,-152 Z" fill="#ead9bd"/>
      <path id="armStroke" d="M8,-188 C36,-182 58,-156 72,-136" stroke="#fff8ea" stroke-width="17"
            fill="none" stroke-linecap="round"/>
      <g id="wing" transform="rotate(0,-2,-192)">
        <path d="M-4,-194 C-30,-204 -62,-192 -64,-168 C-44,-150 -6,-156 6,-176 Z" fill="#f0e1c7"/>
        <path d="M-56,-172 C-38,-166 -16,-168 -2,-180" stroke="#dcc9a8" stroke-width="3" fill="none"/>
        <path d="M-50,-182 C-34,-178 -16,-180 -4,-188" stroke="#dcc9a8" stroke-width="2.5" fill="none"/>
      </g>
      <g id="headGroup">
        <path d="M0,-186 C2,-214 26,-240 52,-246 L66,-224 C42,-220 24,-202 18,-176 Z" fill="#fff8ea"/>
        <circle cx="62" cy="-242" r="22" fill="#fff8ea"/>
        <path d="M44,-258 C52,-266 66,-268 74,-262 C64,-262 52,-260 44,-258 Z" fill="#e8d9c0"/>
        <circle cx="70" cy="-250" r="5.2" fill="#2a2030"/>
        <circle cx="71.6" cy="-251.6" r="1.7" fill="#fff"/>
        <path d="M74,-252 Q130,-248 178,-233 Q150,-230 76,-237 Z" fill="#f09a3c"/>
        <path d="M74,-252 Q130,-248 178,-233" stroke="#d87f2c" stroke-width="2.4" fill="none"/>
        <g id="pouchGroup">
          <path d="M76,-236 C62,-206 84,-174 118,-174 C152,-174 170,-204 175,-231
                   C140,-222 104,-227 76,-236 Z" fill="#ffc06a"/>
          <g clip-path="url(#pouchClip)">
            <path d="M76,-236 C62,-206 84,-174 118,-174 C152,-174 170,-204 175,-231
                     C140,-222 104,-227 76,-236 Z" fill="#ffc06a"/>
            <g id="fish" transform="translate(120,-200) rotate(-10)">
              <path d="M-20,0 L-38,-12 L-38,12 Z" fill="#5fc2cc"/>
              <ellipse rx="23" ry="12.5" fill="#79d6dc"/>
              <path d="M-8,-11 L2,-19 L10,-10 Z" fill="#5fc2cc"/>
              <circle cx="13" cy="-3.5" r="3" fill="#20414d"/>
              <path d="M-14,2 C-4,6 8,6 17,2" stroke="#4fb0ba" stroke-width="2" fill="none"/>
            </g>
          </g>
          <path d="M76,-236 C62,-206 84,-174 118,-174 C152,-174 170,-204 175,-231"
                stroke="#e08a34" stroke-width="3" fill="none"/>
        </g>
        <g id="fishTail" transform="translate(99,-231) rotate(-18)">
          <path d="M0,0 L-15,-13 L-3,-16 L10,-6 Z" fill="#5fc2cc"/>
        </g>
      </g>
    </g>

    <g id="barGroup">
      <path d="M60,-122 L66,-140 Q74,-150 96,-146" stroke="#23232e" stroke-width="7"
            fill="none" stroke-linecap="round"/>
      <rect x="86" y="-152" width="18" height="10" rx="5" fill="#1b1b26" transform="rotate(8,95,-147)"/>
      <g id="bellGroup">
        <circle cx="74" cy="-157" r="10" fill="#ffd166"/>
        <path d="M66,-160 A10,10 0 0 1 80,-163" stroke="#fff0c0" stroke-width="3" fill="none" stroke-linecap="round"/>
        <circle cx="74" cy="-157" r="2.4" fill="#c9922f"/>
      </g>
      <ellipse cx="76" cy="-137" rx="13" ry="9" fill="#fff8ea" transform="rotate(20,76,-137)"/>
    </g>

    <g id="bellRings" fill="none" stroke="#fff3d0" stroke-width="3" opacity="0">
      <circle cx="74" cy="-157" r="16"/>
      <circle cx="74" cy="-157" r="28"/>
      <circle cx="74" cy="-157" r="40"/>
    </g>
  </g>

  <g id="speedLines" stroke="#ffe3b4" stroke-width="3.5" stroke-linecap="round" opacity="0"></g>
  <g id="fgLayer"></g>
  <rect id="dusk" x="0" y="0" width="1600" height="900" fill="#1b1038" opacity="0"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#vigGrad)"/>
</svg>
<div class="hud">
  <div class="row"><span class="k">速度</span><span class="v" id="vSpeed">0.0</span><span class="u">km/h</span></div>
  <div class="row"><span class="k">加速度</span><span class="v" id="vAccel">0.00</span><span class="u">m/s²</span></div>
  <div class="row"><span class="k">里程</span><span class="v" id="vDist">0</span><span class="u" id="uDist">m</span></div>
  <div class="bar"><i id="bar"></i></div>
</div>
<div class="hint">按住 <b>→</b> / <b>D</b> / 长按画面 加速 · <b>空格</b> 按铃 · <b>←</b> 刹车</div>
<div class="ding" id="ding">叮！</div>
</div>
<script>
(function(){
  var NS = "http://www.w3.org/2000/svg";
  function $(id){ return document.getElementById(id); }
  function el(name, attrs){
    var n = document.createElementNS(NS, name);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }

  // ---------- 轮辐 ----------
  function buildSpokes(g){
    for (var i = 0; i < 14; i++){
      var a = i * Math.PI * 2 / 14;
      g.appendChild(el("line", {
        x1: Math.cos(a) * 6, y1: Math.sin(a) * 6,
        x2: Math.cos(a) * 41, y2: Math.sin(a) * 41
      }));
    }
    g.appendChild(el("circle", { r: 41, fill: "none", stroke: "#4b4b60", "stroke-width": 2.5 }));
  }
  buildSpokes($("spokesRear"));
  buildSpokes($("spokesFront"));

  // ---------- 视差图层 ----------
  var layers = [];
  function makeLayer(hostId, factor, period, draw){
    var host = $(hostId);
    var count = Math.ceil((1600 + period * 2) / period) + 1;
    for (var i = 0; i < count; i++){
      var g = el("g", { transform: "translate(" + (i * period) + ",0)" });
      draw(g, i);
      host.appendChild(g);
    }
    layers.push({ node: host, f: factor, p: period });
  }

  makeLayer("cloudLayer", 0.07, 540, function(g, i){
    var sets = [
      [120, 150, 1.25, 0.5], [330, 262, 0.85, 0.38], [60, 330, 1.05, 0.3], [420, 120, 0.7, 0.26]
    ];
    for (var j = 0; j < sets.length; j++){
      var s = sets[j], k = (i + j) % 3;
      var c = el("g", { transform: "translate(" + s[0] + "," + (s[1] + k * 9) + ") scale(" + s[2] + ")", opacity: s[3] });
      c.appendChild(el("path", {
        d: "M0,0 C10,-22 44,-30 62,-14 C80,-30 116,-22 122,0 Z",
        fill: j % 2 ? "#ffd9a8" : "#ffe6c4"
      }));
      c.appendChild(el("rect", { x: 0, y: -2, width: 122, height: 7, rx: 3.5, fill: "#ffd0a0", opacity: 0.8 }));
      g.appendChild(c);
    }
  });

  makeLayer("islandLayer", 0.17, 820, function(g, i){
    if (i % 2 === 0){
      g.appendChild(el("path", {
        d: "M60,470 C120,418 170,402 220,438 C250,460 300,452 340,470 Z",
        fill: "#4b3561", opacity: 0.72
      }));
    } else {
      g.appendChild(el("path", {
        d: "M420,470 C470,436 520,428 570,470 Z", fill: "#553b6b", opacity: 0.6
      }));
      var p = el("g", { transform: "translate(660,470)", opacity: 0.75 });
      p.appendChild(el("path", { d: "M0,0 L-5,-54 L4,-54 L2,0 Z", fill: "#3d2a52" }));
      p.appendChild(el("path", {
        d: "M0,-54 C-26,-70 -40,-62 -44,-52 C-30,-60 -12,-60 0,-54 Z M0,-54 C24,-72 40,-64 44,-54 C30,-62 12,-60 0,-54 Z M0,-54 C-8,-80 2,-90 12,-92 C2,-82 0,-68 0,-54 Z",
        fill: "#3d2a52"
      }));
      g.appendChild(p);
    }
  });

  makeLayer("glitterLayer", 0.34, 190, function(g, i){
    for (var j = 0; j < 5; j++){
      var y = 496 + j * 27;
      var w = 40 + ((i * 7 + j * 31) % 70);
      var x = ((i * 53 + j * 41) % 150);
      g.appendChild(el("rect", {
        x: x, y: y, width: w, height: 4, rx: 2,
        fill: "#ffce86", opacity: 0.1 + 0.16 * ((j + i) % 3), "class": "glint"
      }));
    }
  });

  makeLayer("waveLayer", 0.55, 170, function(g, i){
    for (var j = 0; j < 3; j++){
      var y = 560 + j * 26 + (i % 2) * 7;
      g.appendChild(el("path", {
        d: "M" + (j * 44) + "," + y + " q14,-7 28,0 q14,7 28,0",
        stroke: "#cfe4f2", "stroke-width": 2.6, fill: "none", opacity: 0.22 + j * 0.05
      }));
    }
  });

  makeLayer("railLayer", 1, 104, function(g){
    g.appendChild(el("rect", { x: 20, y: 556, width: 11, height: 86, rx: 3, fill: "#f0dcbb" }));
    g.appendChild(el("rect", { x: 20, y: 556, width: 4, height: 86, fill: "#fff3da" }));
    g.appendChild(el("rect", { x: 0, y: 566, width: 104, height: 8, rx: 4, fill: "#e9d2ae" }));
    g.appendChild(el("rect", { x: 0, y: 608, width: 104, height: 7, rx: 3.5, fill: "#dfc49e" }));
  });

  makeLayer("tileLayer", 1, 150, function(g){
    g.appendChild(el("rect", { x: 0, y: 690, width: 4, height: 210, fill: "#d8c096", opacity: 0.55 }));
    g.appendChild(el("rect", { x: 74, y: 740, width: 4, height: 160, fill: "#d8c096", opacity: 0.4 }));
    g.appendChild(el("path", { d: "M-40,760 L150,760", stroke: "#d8c096", "stroke-width": 3, opacity: 0.35 }));
    g.appendChild(el("path", { d: "M-40,836 L150,836", stroke: "#d4b98e", "stroke-width": 4, opacity: 0.35 }));
  });

  makeLayer("lampLayer", 1, 660, function(g, i){
    var x = 90 + (i % 2) * 180;
    var p = el("g", { transform: "translate(" + x + ",690)" });
    p.appendChild(el("rect", { x: -16, y: -8, width: 32, height: 12, rx: 4, fill: "#3b3348" }));
    p.appendChild(el("rect", { x: -5, y: -176, width: 10, height: 170, rx: 4, fill: "#443a52" }));
    p.appendChild(el("path", { d: "M0,-176 L0,-196 L34,-196", stroke: "#443a52", "stroke-width": 9, fill: "none", "stroke-linecap": "round" }));
    p.appendChild(el("circle", { cx: 34, cy: -190, r: 22, fill: "#ffd98a", opacity: 0.28 }));
    p.appendChild(el("path", { d: "M26,-196 L42,-196 L46,-180 L22,-180 Z", fill: "#ffe3a6" }));
    g.appendChild(p);
  });

  makeLayer("fgLayer", 1.7, 230, function(g, i){
    g.appendChild(el("path", {
      d: "M" + (i % 2 ? 30 : 140) + ",900 c6,-34 14,-44 20,-52 c-2,20 0,36 6,52 Z",
      fill: "#b1946c", opacity: 0.85
    }));
    g.appendChild(el("path", {
      d: "M" + (i % 2 ? 190 : 70) + ",900 c10,-24 18,-32 26,-38 c-6,16 -6,26 -4,38 Z",
      fill: "#a6885f", opacity: 0.7
    }));
  });

  // ---------- 速度线 ----------
  var slNode = $("speedLines"), slines = [];
  for (var s = 0; s < 6; s++){
    var ln = el("line", { x1: 0, y1: 0, x2: 0, y2: 0 });
    slNode.appendChild(ln);
    slines.push({ node: ln, y: 592 + s * 46, ph: Math.random(), len: 54 + Math.random() * 80 });
  }

  // ---------- 海鸥 ----------
  var gullNode = $("gullLayer"), gulls = [];
  for (var gi = 0; gi < 4; gi++){
    var gg = el("g", {});
    var wings = el("path", {
      d: "M-16,0 Q-8,-11 0,-1 Q8,-11 16,0", stroke: "#3a2a4a", "stroke-width": 3,
      fill: "none", "stroke-linecap": "round"
    });
    gg.appendChild(wings);
    gullNode.appendChild(gg);
    gulls.push({ node: gg, wing: wings, x: Math.random() * 1600, y: 150 + gi * 58,
                 sp: 22 + gi * 11, ph: Math.random() * 6, sc: 0.7 + gi * 0.2 });
  }

  // ---------- 物理状态 ----------
  var ST = { v: 0, a: 0, aDisp: 0, dist: 0, hold: false, brake: false,
             wheel: 0, crank: 0, t: 0, bell: -9 };
  var PX_PER_M = 62, V_MAX = 10.2, R_WHEEL = 46;

  // ---------- 输入 ----------
  var holdKeys = { ArrowRight: 1, ArrowUp: 1, KeyD: 1, KeyW: 1 };
  var brakeKeys = { ArrowLeft: 1, ArrowDown: 1, KeyA: 1, KeyS: 1 };
  window.addEventListener("keydown", function(e){
    if (holdKeys[e.code]) { ST.hold = true; e.preventDefault(); }
    else if (brakeKeys[e.code]) { ST.brake = true; e.preventDefault(); }
    else if (e.code === "Space") { e.preventDefault(); if (!e.repeat) ringBell(); }
  });
  window.addEventListener("keyup", function(e){
    if (holdKeys[e.code]) ST.hold = false;
    if (brakeKeys[e.code]) ST.brake = false;
  });
  var stage = $("stage");
  stage.addEventListener("pointerdown", function(e){ ST.hold = true; stage.setPointerCapture(e.pointerId); });
  stage.addEventListener("pointerup", function(){ ST.hold = false; });
  stage.addEventListener("pointercancel", function(){ ST.hold = false; });
  window.addEventListener("blur", function(){ ST.hold = false; ST.brake = false; });

  // ---------- 铃声 ----------
  var ac = null;
  function ringBell(){
    ST.bell = ST.t;
    var d = $("ding");
    d.classList.remove("on");
    void d.offsetWidth;
    d.classList.add("on");
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === "suspended") ac.resume();
      var now = ac.currentTime;
      [1660, 2480, 3320].forEach(function(f, i){
        var o = ac.createOscillator(), g = ac.createGain();
        o.type = "sine"; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(0.22 / (i + 1.4), now + 0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 1.05 - i * 0.22);
        o.connect(g); g.connect(ac.destination);
        o.start(now); o.stop(now + 1.1);
      });
    } catch (err) {}
  }

  // ---------- 两段腿 IK ----------
  function ik(hx, hy, tx, ty, l1, l2, bend){
    var dx = tx - hx, dy = ty - hy;
    var d = Math.sqrt(dx * dx + dy * dy);
    d = Math.max(Math.abs(l1 - l2) + 0.02, Math.min(l1 + l2 - 0.02, d));
    var base = Math.atan2(dy, dx);
    var cs = (d * d + l1 * l1 - l2 * l2) / (2 * d * l1);
    cs = Math.max(-1, Math.min(1, cs));
    var ang = base + bend * Math.acos(cs);
    return { x: hx + Math.cos(ang) * l1, y: hy + Math.sin(ang) * l1 };
  }

  var HIP_X = -8, HIP_Y = -150, THIGH = 58, SHIN = 60, CRANK_R = 22, BB_Y = -40;
  var refs = {
    wheelRear: $("wheelRear"), wheelFront: $("wheelFront"),
    spokesRear: $("spokesRear"), spokesFront: $("spokesFront"),
    crankALine: $("crankALine"), crankBLine: $("crankBLine"),
    pedalA: $("pedalA"), pedalB: $("pedalB"),
    legs: {
      near: { t: $("legNearThigh"), s: $("legNearShin"), f: $("footNear") },
      far: { t: $("legFarThigh"), s: $("legFarShin"), f: $("footFar") }
    },
    pelican: $("pelican"), wing: $("wing"), head: $("headGroup"),
    pouch: $("pouchGroup"), fish: $("fish"), fishTail: $("fishTail"),
    bell: $("bellGroup"), rings: $("bellRings"), bike: $("bike"),
    shadow: $("shadow"), sun: $("sunGroup"), dusk: $("dusk"),
    vSpeed: $("vSpeed"), vAccel: $("vAccel"), vDist: $("vDist"),
    uDist: $("uDist"), bar: $("bar")
  };

  function setLeg(leg, theta, bendSign){
    var px = Math.cos(theta) * CRANK_R;
    var py = BB_Y + Math.sin(theta) * CRANK_R;
    var knee = ik(HIP_X, HIP_Y, px, py - 6, THIGH, SHIN, bendSign);
    leg.t.setAttribute("d", "M" + HIP_X + "," + HIP_Y + " L" + knee.x.toFixed(1) + "," + knee.y.toFixed(1));
    leg.s.setAttribute("d", "M" + knee.x.toFixed(1) + "," + knee.y.toFixed(1) + " L" + px.toFixed(1) + "," + (py - 6).toFixed(1));
    leg.f.setAttribute("cx", px.toFixed(1));
    leg.f.setAttribute("cy", (py - 2).toFixed(1));
    return { x: px, y: py };
  }

  // ---------- 主循环 ----------
  var last = performance.now();
  function frame(now){
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    ST.t += dt;

    var push = ST.hold ? 3.9 : 0;
    var brake = ST.brake ? -6.2 : 0;
    var drag = -(0.031 * ST.v * ST.v + (ST.v > 0.02 ? 0.34 : 0));
    var a = push + brake + drag;
    if (ST.v <= 0 && a < 0) a = 0;
    ST.v = Math.max(0, ST.v + a * dt);
    ST.a = a;
    ST.aDisp += (a - ST.aDisp) * Math.min(1, dt * 7);
    ST.dist += ST.v * dt;

    var distPx = ST.dist * PX_PER_M;
    ST.wheel += (ST.v * PX_PER_M * dt) / R_WHEEL;
    ST.crank = ST.wheel / 1.45;

    for (var i = 0; i < layers.length; i++){
      var L = layers[i];
      var off = -(((distPx * L.f) % L.p) + L.p) % L.p;
      L.node.setAttribute("transform", "translate(" + off.toFixed(2) + ",0)");
    }

    var deg = ST.wheel * 180 / Math.PI;
    refs.spokesRear.setAttribute("transform", "rotate(" + deg.toFixed(2) + ")");
    refs.spokesFront.setAttribute("transform", "rotate(" + deg.toFixed(2) + ")");

    var pa = setLeg(refs.legs.near, ST.crank, -1);
    var pb = setLeg(refs.legs.far, ST.crank + Math.PI, -1);
    refs.crankALine.setAttribute("x2", pa.x.toFixed(1));
    refs.crankALine.setAttribute("y2", pa.y.toFixed(1));
    refs.crankBLine.setAttribute("x2", pb.x.toFixed(1));
    refs.crankBLine.setAttribute("y2", pb.y.toFixed(1));
    refs.pedalA.setAttribute("transform", "translate(" + pa.x.toFixed(1) + "," + pa.y.toFixed(1) + ")");
    refs.pedalB.setAttribute("transform", "translate(" + pb.x.toFixed(1) + "," + pb.y.toFixed(1) + ")");

    var vN = Math.min(1, ST.v / V_MAX);
    var bob = Math.sin(ST.crank * 2) * (1.4 + vN * 1.8);
    refs.pelican.setAttribute("transform", "translate(0," + bob.toFixed(2) + ") rotate(" + (-vN * 3).toFixed(2) + ",-10,-170)");
    refs.bike.setAttribute("transform", "translate(0," + (bob * 0.3).toFixed(2) + ")");
    refs.shadow.setAttribute("rx", (104 - vN * 8).toFixed(1));
    refs.shadow.setAttribute("opacity", (0.5 - vN * 0.12).toFixed(2));

    var flap = Math.sin(ST.crank * 1.1 + 0.6) * (3 + vN * 13);
    refs.wing.setAttribute("transform", "rotate(" + flap.toFixed(2) + ",-2,-192)");
    refs.head.setAttribute("transform", "rotate(" + (Math.sin(ST.crank + 1.2) * (1 + vN * 2.2)).toFixed(2) + ",18,-200)");

    var pw = Math.sin(ST.crank * 2 + 0.8) * (2.2 + vN * 5);
    refs.pouch.setAttribute("transform", "rotate(" + pw.toFixed(2) + ",78,-238)");
    refs.fish.setAttribute("transform",
      "translate(" + (120 + Math.sin(ST.crank * 2.6) * (1.5 + vN * 3)).toFixed(1) + "," +
      (-200 + Math.cos(ST.crank * 2.2) * (1 + vN * 2.6)).toFixed(1) + ") rotate(" +
      (-10 + Math.sin(ST.crank * 3.1) * (4 + vN * 7)).toFixed(1) + ")");
    refs.fishTail.setAttribute("transform",
      "translate(99,-231) rotate(" + (-18 + Math.sin(ST.t * 7 + ST.crank) * (6 + vN * 12)).toFixed(1) + ")");

    var bt = ST.t - ST.bell;
    if (bt < 0.6){
      var k = bt / 0.6;
      refs.bell.setAttribute("transform", "rotate(" + (Math.sin(bt * 52) * 15 * (1 - k)).toFixed(2) + ",74,-166)");
      refs.rings.setAttribute("opacity", (1 - k).toFixed(3));
      refs.rings.setAttribute("transform",
        "translate(" + (74 * (1 - (1 + k * 0.5))).toFixed(1) + "," + (-157 * (1 - (1 + k * 0.5))).toFixed(1) +
        ") scale(" + (1 + k * 0.5).toFixed(3) + ")");
    } else if (refs.rings.getAttribute("opacity") !== "0"){
      refs.rings.setAttribute("opacity", 0);
      refs.bell.setAttribute("transform", "rotate(0,74,-166)");
    }

    slNode.setAttribute("opacity", Math.max(0, Math.min(0.42, (vN - 0.42) * 1.1)).toFixed(3));
    for (var s2 = 0; s2 < slines.length; s2++){
      var L2 = slines[s2];
      var x = 1620 - (((distPx * 2.4 + L2.ph * 1400) % 1900));
      L2.node.setAttribute("x1", x.toFixed(1));
      L2.node.setAttribute("x2", (x + L2.len * (0.4 + vN)).toFixed(1));
      L2.node.setAttribute("y1", L2.y);
      L2.node.setAttribute("y2", L2.y);
    }

    for (var gj = 0; gj < gulls.length; gj++){
      var G = gulls[gj];
      G.x -= (G.sp + ST.v * 6) * dt;
      if (G.x < -60) G.x = 1680;
      var gy = G.y + Math.sin(ST.t * 0.7 + G.ph) * 18;
      G.node.setAttribute("transform",
        "translate(" + G.x.toFixed(1) + "," + gy.toFixed(1) + ") scale(" + G.sc.toFixed(2) + "," +
        (G.sc * (0.55 + 0.6 * Math.abs(Math.sin(ST.t * 3.4 + G.ph)))).toFixed(2) + ")");
    }

    var sink = Math.min(58, ST.dist / 2600 * 58);
    refs.sun.setAttribute("transform", "translate(0," + sink.toFixed(2) + ")");
    refs.dusk.setAttribute("opacity", (Math.min(0.3, ST.dist / 2600 * 0.3)).toFixed(3));

    refs.vSpeed.textContent = (ST.v * 3.6).toFixed(1);
    refs.vAccel.textContent = (ST.aDisp >= 0 ? "+" : "") + ST.aDisp.toFixed(2);
    if (ST.dist >= 1000){
      refs.vDist.textContent = (ST.dist / 1000).toFixed(2);
      refs.uDist.textContent = "km";
    } else {
      refs.vDist.textContent = ST.dist.toFixed(0);
      refs.uDist.textContent = "m";
    }
    refs.bar.style.width = (vN * 100).toFixed(1) + "%";

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
